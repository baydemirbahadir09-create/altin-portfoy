<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Altın Portföy</title>

<style>
:root{
  --bg:#090b0e;
  --card:#12151a;
  --line:#242932;
  --text:#f6f7f8;
  --muted:#8e96a3;
  --green:#40d99b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px 100px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.brand{
  font-size:20px;
  font-weight:800
}

.live{
  font-size:11px;
  color:var(--green);
  background:#103527;
  padding:6px 9px;
  border-radius:99px
}

.hero{
  background:linear-gradient(145deg,#171b21,#101216);
  border:1px solid var(--line);
  border-radius:24px;
  padding:21px;
  margin-bottom:14px
}

.label{
  color:var(--muted);
  font-size:12px
}

.total{
  font-size:36px;
  font-weight:800;
  letter-spacing:-1px;
  margin:7px 0
}

.status{
  font-size:12px;
  color:var(--muted)
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:17px
}

.mini{
  background:#0c0f13;
  border:1px solid #20242b;
  border-radius:15px;
  padding:12px
}

.mini b{
  display:block;
  margin-top:4px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:21px;
  padding:16px;
  margin:14px 0
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px
}

.head b{
  font-size:16px
}

button{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  font-weight:750;
  background:#f3f4f6;
  color:#101114;
  cursor:pointer
}

.secondary{
  background:#242a33;
  color:#fff
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line)
}

.row:last-child{
  border-bottom:0
}

.name{
  font-weight:700
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:4px
}

.right{
  text-align:right
}

.sell{
  font-weight:750
}

.buy{
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:22px 5px;
  font-size:13px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:flex-end;
  z-index:5
}

.sheet{
  background:#15181d;
  width:100%;
  max-width:520px;
  margin:auto;
  border-radius:25px 25px 0 0;
  padding:20px 18px 28px;
  border-top:1px solid #2b3039
}

select,input{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #303640;
  background:#0d1014;
  color:#fff;
  font-size:16px;
  margin:6px 0 15px
}

.actions{
  display:flex;
  gap:8px
}

.actions button{
  flex:1
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#f2f3f5;
  color:#111;
  padding:10px 14px;
  border-radius:99px;
  font-size:13px;
  display:none;
  z-index:9
}

footer{
  text-align:center;
  color:#5f6670;
  font-size:10px;
  margin-top:22px
}
</style>
</head>

<body>

<main class="app">

<div class="top">
  <div class="brand">₺ Altın Portföy</div>
  <div class="live" id="live">● CANLI</div>
</div>

<section class="hero">

  <div class="label">
    PORTFÖYÜN GÜNCEL SATIŞ DEĞERİ
  </div>

  <div id="total" class="total">
    ₺0,00
  </div>

  <div id="updated" class="status">
    Veriler yükleniyor…
  </div>

  <div class="grid">

    <div class="mini">
      <span class="label">Varlık sayısı</span>
      <b id="count">0</b>
    </div>

    <div class="mini">
      <span class="label">Son yenileme</span>
      <b id="time">—</b>
    </div>

  </div>

</section>


<section class="card">

  <div class="head">
    <b>Varlıklarım</b>
    <button type="button" onclick="openModal()">＋ Ekle</button>
  </div>

  <div id="assets"></div>

</section>


<section class="card">

  <div class="head">
    <b>Canlı Kurlar</b>

    <button
      type="button"
      class="secondary"
      onclick="load()">
      ↻
    </button>
  </div>

  <div id="prices">
    <div class="empty">
      Veriler yükleniyor…
    </div>
  </div>

</section>


<footer>
  Fiyat kaynağı: Altınkaynak • Bilgi amaçlıdır
</footer>

</main>


<div class="modal" id="modal">

  <div class="sheet">

    <h2 style="margin-top:0">
      Varlık ekle
    </h2>

    <label class="label">
      Varlık
    </label>

    <select id="type"></select>

    <label class="label">
      Miktar
    </label>

    <input
      id="qty"
      type="number"
      step="0.001"
      min="0"
      placeholder="Örn. 10">

    <div class="actions">

      <button
        type="button"
        class="secondary"
        onclick="closeModal()">
        Vazgeç
      </button>

      <button
        type="button"
        onclick="addAsset()">
        Portföye Ekle
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

const API = {
  prices:"/api/prices"
};


/*
  API'DEKİ KODLAR DOĞRUDAN KULLANILIYOR.

  GA   = Gram
  PC   = Çeyrek
  PY   = Yarım
  PT   = Tam/Teklik
  PA   = Ata
  CH_T = Külçe
  USD  = Dolar
  EUR  = Euro
  GBP  = Sterlin
*/

const products = [

  {
    label:"Gram Altın",
    code:"GA"
  },

  {
    label:"Çeyrek Altın",
    code:"PC"
  },

  {
    label:"Yarım Altın",
    code:"PY"
  },

  {
    label:"Tam Altın",
    code:"PT"
  },

  {
    label:"Ata Cumhuriyet",
    code:"PA"
  },

  {
    label:"Külçe Altın",
    code:"CH_T"
  },

  {
    label:"USD",
    code:"USD"
  },

  {
    label:"EUR",
    code:"EUR"
  },

  {
    label:"GBP",
    code:"GBP"
  }

];


let pricesByCode = {};

let assets = [];


try{

  assets =
    JSON.parse(
      localStorage.getItem("altinAssets") || "[]"
    );

  if(!Array.isArray(assets)){
    assets=[];
  }

}catch(e){

  assets=[];

}


const type =
  document.getElementById("type");


products.forEach(product=>{

  type.add(
    new Option(
      product.label,
      product.label
    )
  );

});


function fmt(value){

  return new Intl.NumberFormat(
    "tr-TR",
    {
      style:"currency",
      currency:"TRY",
      maximumFractionDigits:2
    }
  ).format(
    Number(value) || 0
  );

}


function getProduct(label){

  const product =
    products.find(
      p => p.label === label
    );

  if(!product){
    return null;
  }

  /*
    BURADA İSİM EŞLEŞTİRMESİ YOK.

    Örneğin Gram Altın:
    products -> GA
    API -> GA

    Direkt aynı kod.
  */

  return pricesByCode[product.code] || null;

}


function render(){

  let total=0;

  let html="";


  assets.forEach((asset,index)=>{

    const price =
      getProduct(asset.type);

    const quantity =
      Number(asset.qty) || 0;

    let value=0;

    if(price){

      value =
        price.buy * quantity;

    }

    total += value;


    html += `

      <div class="row">

        <div>

          <div class="name">
            ${asset.type}
          </div>

          <div class="sub">
            ${quantity} adet
          </div>

        </div>


        <div class="right">

          <div class="sell">

            ${
              price
                ? fmt(value)
                : "—"
            }

          </div>

          <div class="sub">

            ${
              price
                ? "Silmek için dokun"
                : "Fiyat bekleniyor"
            }

          </div>

        </div>

      </div>

    `;

  });


  document
    .getElementById("assets")
    .innerHTML =
      html ||

      `
        <div class="empty">

          Henüz varlık eklemedin.<br>

          Yukarıdaki
          <b>＋ Ekle</b>
          butonuna bas.

        </div>
      `;


  document
    .getElementById("total")
    .textContent =
      fmt(total);


  document
    .getElementById("count")
    .textContent =
      assets.length;


  document
    .querySelectorAll("#assets .row")
    .forEach((element,index)=>{

      element.onclick=()=>{

        if(
          confirm(
            assets[index].type +
            " varlığını silmek istiyor musun?"
          )
        ){

          assets.splice(index,1);

          save(false);

          render();

        }

      };

    });

}


function renderPrices(){

  let html="";


  products.forEach(product=>{

    /*
      API'den gelen KODU doğrudan kullanıyoruz.
    */

    const price =
      pricesByCode[product.code];


    if(!price){

      return;

    }


    html += `

      <div class="row">

        <div>

          <div class="name">
            ${product.label}
          </div>

          <div class="sub">
            Alış / Satış
          </div>

        </div>


        <div class="right">

          <div class="buy">

            ${fmt(price.buy)}

          </div>

          <div class="sell">

            ${fmt(price.sell)}

          </div>

        </div>

      </div>

    `;

  });


  document
    .getElementById("prices")
    .innerHTML =
      html ||

      `
        <div class="empty">
          Canlı veri alınamadı.
        </div>
      `;

}


async function load(){

  document
    .getElementById("updated")
    .textContent =
      "Altınkaynak verisi alınıyor…";


  try{

    const response =
      await fetch(
        API.prices +
        "?t=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Cache-Control":"no-cache"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      API'DEN GELEN VERİ:

      data.gold
      data.currency

      Bunların içindeki code değerlerini
      doğrudan pricesByCode'a koyuyoruz.
    */

    pricesByCode={};


    const allPrices = [

      ...(Array.isArray(data.gold)
        ? data.gold
        : []),

      ...(Array.isArray(data.currency)
        ? data.currency
        : [])

    ];


    allPrices.forEach(item=>{

      if(!item.code){

        return;

      }


      pricesByCode[item.code]={

        buy:Number(item.buy),

        sell:Number(item.sell),

        code:item.code,

        name:item.name,

        updatedAt:item.updatedAt

      };

    });


    console.log(
      "Altınkaynak verisi:",
      pricesByCode
    );


    render();

    renderPrices();


    const now =
      new Date();


    document
      .getElementById("time")
      .textContent =
        now.toLocaleTimeString(
          "tr-TR",
          {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
          }
        );


    document
      .getElementById("updated")
      .textContent =
        data.updatedAt
          ? "Altınkaynak güncellemesi: " +
            data.updatedAt
          : "Altınkaynak verisi güncel";


    document
      .getElementById("live")
      .textContent =
        "● CANLI";


  }catch(error){

    console.error(
      "Fiyat yükleme hatası:",
      error
    );


    document
      .getElementById("live")
      .textContent =
        "● BAĞLANTI YOK";


    document
      .getElementById("updated")
      .textContent =
        "Canlı veri bağlantısı kurulamadı.";


    render();

    renderPrices();

  }

}


function save(show=true){

  localStorage.setItem(
    "altinAssets",
    JSON.stringify(assets)
  );


  if(show){

    showToast(
      "Portföy kaydedildi"
    );

  }

}


function openModal(){

  const modal =
    document.getElementById("modal");


  modal.style.display="flex";

  document.body.style.overflow="hidden";


  setTimeout(()=>{

    document
      .getElementById("qty")
      .focus();

  },100);

}


function closeModal(){

  document
    .getElementById("modal")
    .style.display="none";


  document.body.style.overflow="";

}


function addAsset(){

  const quantity =
    parseFloat(
      document
        .getElementById("qty")
        .value
    );


  const selected =
    type.value;


  if(!selected){

    showToast(
      "Önce varlık seç"
    );

    return;

  }


  if(
    !Number.isFinite(quantity) ||
    quantity<=0
  ){

    showToast(
      "Geçerli bir miktar gir"
    );

    return;

  }


  assets.push({

    type:selected,

    qty:quantity

  });


  save(false);

  render();


  document
    .getElementById("qty")
    .value="";


  closeModal();


  showToast(
    selected +
    " portföye eklendi"
  );

}


function showToast(text){

  const toast =
    document
      .getElementById("toast");


  toast.textContent=text;

  toast.style.display="block";


  setTimeout(()=>{

    toast.style.display="none";

  },1800);

}


/*
  İlk yükleme
*/

render();

load();


/*
  Uygulama açıkken
  30 saniyede bir Altınkaynak'tan
  tekrar güncel veri alınır.
*/

setInterval(
  load,
  30000
);

</script>

</body>
</html>
