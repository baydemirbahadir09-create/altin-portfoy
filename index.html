<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Altın Portföy</title>

<style>
:root{
  --bg:#090b0e;
  --card:#12151a;
  --line:#242932;
  --text:#f6f7f8;
  --muted:#8e96a3;
  --green:#40d99b;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px 100px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.brand{
  font-size:20px;
  font-weight:800
}

.live{
  font-size:11px;
  color:var(--green);
  background:#103527;
  padding:6px 9px;
  border-radius:99px
}

.hero{
  background:linear-gradient(145deg,#171b21,#101216);
  border:1px solid var(--line);
  border-radius:24px;
  padding:21px;
  margin-bottom:14px
}

.label{
  color:var(--muted);
  font-size:12px
}

.total{
  font-size:36px;
  font-weight:800;
  letter-spacing:-1px;
  margin:7px 0
}

.status{
  font-size:12px;
  color:var(--muted)
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:17px
}

.mini{
  background:#0c0f13;
  border:1px solid #20242b;
  border-radius:15px;
  padding:12px
}

.mini b{
  display:block;
  margin-top:4px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:21px;
  padding:16px;
  margin:14px 0
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  gap:8px
}

.head b{
  font-size:16px
}

button{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  font-weight:750;
  background:#f3f4f6;
  color:#101114;
  cursor:pointer
}

.secondary{
  background:#242a33;
  color:#fff
}

.toggle{
  background:#242a33;
  color:#fff;
  font-size:11px;
  padding:8px 10px
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  gap:10px
}

.row:last-child{
  border-bottom:0
}

.name{
  font-weight:700
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:4px
}

.right{
  text-align:right
}

.sell{
  font-weight:750
}

.buy{
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:22px 5px;
  font-size:13px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:flex-end;
  z-index:5
}

.sheet{
  background:#15181d;
  width:100%;
  max-width:520px;
  margin:auto;
  border-radius:25px 25px 0 0;
  padding:20px 18px 28px;
  border-top:1px solid #2b3039
}

select,
input{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #303640;
  background:#0d1014;
  color:#fff;
  font-size:16px;
  margin:6px 0 15px
}

.actions{
  display:flex;
  gap:8px
}

.actions button{
  flex:1
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#f2f3f5;
  color:#111;
  padding:10px 14px;
  border-radius:99px;
  font-size:13px;
  display:none;
  z-index:9
}

footer{
  text-align:center;
  color:#5f6670;
  font-size:10px;
  margin-top:22px
}
</style>
</head>

<body>

<main class="app">

<div class="top">

  <div class="brand">
    ₺ Altın Portföy
  </div>

  <div
    class="live"
    id="live">
    ● CANLI
  </div>

</div>


<section class="hero">

  <div class="label">
    PORTFÖYÜN GÜNCEL SATIŞ DEĞERİ
  </div>

  <div
    id="total"
    class="total">
    ₺0,00
  </div>

  <div
    id="updated"
    class="status">
    Veriler yükleniyor…
  </div>

  <div class="grid">

    <div class="mini">

      <span class="label">
        Varlık sayısı
      </span>

      <b id="count">
        0
      </b>

    </div>

    <div class="mini">

      <span class="label">
        Son yenileme
      </span>

      <b id="time">
        —
      </b>

    </div>

  </div>

</section>


<section class="card">

  <div class="head">

    <b>
      Varlıklarım
    </b>

    <button
      type="button"
      onclick="openModal()">
      ＋ Ekle
    </button>

  </div>

  <div id="assets"></div>

</section>


<section class="card">

  <div class="head">

    <b>
      Canlı Kurlar
    </b>

    <div style="display:flex;gap:6px">

      <button
        type="button"
        class="toggle"
        id="priceModeButton"
        onclick="toggleAllPrices()">
        Tümünü göster
      </button>

      <button
        type="button"
        class="secondary"
        onclick="load()">
        ↻
      </button>

    </div>

  </div>

  <div id="prices">

    <div class="empty">
      Veriler yükleniyor…
    </div>

  </div>

</section>


<footer>
  Fiyat kaynağı: Altınkaynak • Bilgi amaçlıdır
</footer>

</main>


<div
  class="modal"
  id="modal">

  <div class="sheet">

    <h2 style="margin-top:0">
      Varlık ekle
    </h2>

    <label class="label">
      Görünüm
    </label>

    <button
      type="button"
      class="toggle"
      id="assetModeButton"
      onclick="toggleAllAssets()"
      style="width:100%;margin:6px 0 15px">
      Tüm varlıkları göster
    </button>

    <label class="label">
      Varlık
    </label>

    <select id="type"></select>

    <label class="label">
      Miktar
    </label>

    <input
      id="qty"
      type="number"
      step="0.001"
      min="0"
      placeholder="Örn. 10">

    <div class="actions">

      <button
        type="button"
        class="secondary"
        onclick="closeModal()">
        Vazgeç
      </button>

      <button
        type="button"
        onclick="addAsset()">
        Portföye Ekle
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>


<script>

const API = {
  prices:"/api/prices"
};


/* =========================
   TEMEL VARLIKLAR
========================= */

const DEFAULT_GOLD_CODES = [
  "GA",
  "B_T",
  "PC",
  "PY"
];

const DEFAULT_CURRENCY_CODES = [
  "USD",
  "EUR",
  "GBP"
];


/* =========================
   DURUM
========================= */

let goldProducts = [];

let currencyProducts = [];

let pricesByCode = {};

let assets = [];

let showAllPrices = false;

let showAllAssets = false;


/* =========================
   LOCAL STORAGE
========================= */

try{

  assets =
    JSON.parse(
      localStorage.getItem(
        "altinAssets"
      ) || "[]"
    );

  if(!Array.isArray(assets)){
    assets=[];
  }

}catch(e){

  assets=[];

}


const type =
  document.getElementById(
    "type"
  );


/* =========================
   PARA FORMAT
========================= */

function fmt(value){

  return new Intl.NumberFormat(
    "tr-TR",
    {
      style:"currency",
      currency:"TRY",
      maximumFractionDigits:2
    }
  ).format(
    Number(value) || 0
  );

}


/* =========================
   TEMEL ÜRÜN KONTROLÜ
========================= */

function isDefaultCode(code){

  return (
    code === "TRY" ||
    DEFAULT_GOLD_CODES.includes(code) ||
    DEFAULT_CURRENCY_CODES.includes(code)
  );

}


/* =========================
   EKLE MENÜSÜ
========================= */

function buildAssetOptions(){

  type.innerHTML="";


  /*
    TL
  */

  type.add(
    new Option(
      "Türk Lirası (TL)",
      "TRY"
    )
  );


  /*
    ALTINLAR
  */

  const goldList =
    showAllAssets
      ? goldProducts
      : goldProducts.filter(
          item =>
            DEFAULT_GOLD_CODES.includes(
              item.code
            )
        );


  goldList.forEach(
    item => {

      if(!item.code){
        return;
      }

      type.add(
        new Option(
          item.name,
          item.code
        )
      );

    }
  );


  /*
    DÖVİZLER

    Sadece USD/EUR/GBP.
  */

  const currencyList =
    currencyProducts.filter(
      item =>
        DEFAULT_CURRENCY_CODES.includes(
          item.code
        )
    );


  currencyList.forEach(
    item => {

      type.add(
        new Option(
          item.name || item.code,
          item.code
        )
      );

    }
  );


  /*
    Buton yazısı
  */

  document
    .getElementById(
      "assetModeButton"
    )
    .textContent =
      showAllAssets
        ? "Sadece temel varlıklar"
        : "Tüm varlıkları göster";

}


/* =========================
   TÜM EKLEME SEÇENEKLERİ
========================= */

function toggleAllAssets(){

  showAllAssets =
    !showAllAssets;

  buildAssetOptions();

}


/* =========================
   FİYAT BUL
========================= */

function getPrice(code){

  return (
    pricesByCode[code] ||
    null
  );

}


/* =========================
   ASSET KODU BUL
========================= */

function findAssetCode(asset){

  if(!asset){
    return null;
  }


  /*
    Gram Altın her zaman GA.
  */

  if(
    asset.type === "Gram Altın" ||
    asset.name === "Gram Altın"
  ){

    return "GA";

  }


  /*
    TL
  */

  if(
    asset.code === "TRY"
  ){

    return "TRY";

  }


  /*
    Mevcut kayıt
  */

  if(
    asset.code &&
    pricesByCode[asset.code]
  ){

    return asset.code;

  }


  /*
    Eski kayıtları isimden bul
  */

  if(asset.type){

    const allProducts = [

      ...goldProducts,

      ...currencyProducts

    ];


    const found =
      allProducts.find(
        item =>
          item.name === asset.type
      );


    if(found){

      if(
        asset.type === "Gram Altın"
      ){

        return "GA";

      }

      return found.code;

    }

  }


  return null;

}


/* =========================
   PORTFÖY
========================= */

function render(){

  let total = 0;

  let html = "";


  assets.forEach(
    (asset,index) => {

      const code =
        findAssetCode(asset);


      const quantity =
        Number(asset.qty) || 0;


      let value = 0;

      let displayName =
        asset.type ||
        "Varlık";


      /*
        TL
      */

      if(
        code === "TRY"
      ){

        value =
          quantity;

        displayName =
          "Türk Lirası (TL)";

      }


      /*
        Diğer varlıklar
      */

      else{

        const price =
          code
            ? getPrice(code)
            : null;


        if(price){

          value =
            Number(price.buy || 0) *
            quantity;


          displayName =
            price.name ||
            displayName;

        }

      }


      html += `

        <div class="row">

          <div>

            <div class="name">
              ${displayName}
            </div>

            <div class="sub">

              ${quantity}

              ${
                code === "TRY"
                  ? "TL"
                  : "adet"
              }

            </div>

          </div>


          <div class="right">

            <div class="sell">
              ${fmt(value)}
            </div>

            <div class="sub">

              ${
                code === "TRY"
                  ? "Nakit TL • Silmek için dokun"
                  : "Alış fiyatı • Silmek için dokun"
              }

            </div>

          </div>

        </div>

      `;


      total += value;

    }
  );


  document
    .getElementById(
      "assets"
    )
    .innerHTML =

      html ||

      `
        <div class="empty">

          Henüz varlık eklemedin.<br>

          Yukarıdaki
          <b>＋ Ekle</b>
          butonuna bas.

        </div>
      `;


  document
    .getElementById(
      "total"
    )
    .textContent =
      fmt(total);


  document
    .getElementById(
      "count"
    )
    .textContent =
      assets.length;


  /*
    Silme
  */

  document
    .querySelectorAll(
      "#assets .row"
    )
    .forEach(
      (element,index) => {

        element.onclick = () => {

          if(
            confirm(
              "Bu varlığı silmek istiyor musun?"
            )
          ){

            assets.splice(
              index,
              1
            );

            save(false);

            render();

          }

        };

      }
    );

}


/* =========================
   CANLI KURLAR
========================= */

function renderPrices(){

  let html = "";


  /*
    Görüntülenecek altınlar
  */

  const goldList =
    showAllPrices
      ? goldProducts
      : goldProducts.filter(
          item =>
            DEFAULT_GOLD_CODES.includes(
              item.code
            )
        );


  /*
    ALTINLAR
  */

  goldList.forEach(
    item => {

      const price =
        pricesByCode[
          item.code
        ];


      if(!price){
        return;
      }


      html += `

        <div class="row">

          <div>

            <div class="name">
              ${item.name}
            </div>

            <div class="sub">
              Alış / Satış
            </div>

          </div>


          <div class="right">

            <div class="buy">
              ${fmt(price.buy)}
            </div>

            <div class="sell">
              ${fmt(price.sell)}
            </div>

          </div>

        </div>

      `;

    }
  );


  /*
    DÖVİZLER
  */

  currencyProducts
    .filter(
      item =>
        DEFAULT_CURRENCY_CODES.includes(
          item.code
        )
    )
    .forEach(
      item => {

        const price =
          pricesByCode[
            item.code
          ];


        if(!price){
          return;
        }


        html += `

          <div class="row">

            <div>

              <div class="name">
                ${price.name || item.code}
              </div>

              <div class="sub">
                Alış / Satış
              </div>

            </div>


            <div class="right">

              <div class="buy">
                ${fmt(price.buy)}
              </div>

              <div class="sell">
                ${fmt(price.sell)}
              </div>

            </div>

          </div>

        `;

      }
    );


  document
    .getElementById(
      "prices"
    )
    .innerHTML =

      html ||

      `
        <div class="empty">
          Canlı veri alınamadı.
        </div>
      `;


  /*
    Buton yazısı
  */

  document
    .getElementById(
      "priceModeButton"
    )
    .textContent =
      showAllPrices
        ? "Sadece temel varlıklar"
        : "Tümünü göster";

}


/* =========================
   TÜM KURLARI GÖSTER / GİZLE
========================= */

function toggleAllPrices(){

  showAllPrices =
    !showAllPrices;

  renderPrices();

}


/* =========================
   API
========================= */

async function load(){

  document
    .getElementById(
      "updated"
    )
    .textContent =
      "Altınkaynak verisi alınıyor…";


  try{

    const response =
      await fetch(
        API.prices +
        "?t=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Cache-Control":
              "no-cache"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      ALTIN
    */

    goldProducts =
      Array.isArray(
        data.gold
      )
        ? data.gold
        : [];


    /*
      DÖVİZ
    */

    currencyProducts =
      Array.isArray(
        data.currency
      )
        ? data.currency
        : [];


    /*
      FİYATLAR
    */

    pricesByCode = {};


    const allPrices = [

      ...goldProducts,

      ...currencyProducts

    ];


    allPrices.forEach(
      item => {

        if(!item.code){
          return;
        }


        pricesByCode[
          item.code
        ] = {

          code:item.code,

          name:item.name,

          buy:Number(
            item.buy
          ),

          sell:Number(
            item.sell
          ),

          updatedAt:
            item.updatedAt

        };

      }
    );


    /*
      TL
    */

    pricesByCode["TRY"] = {

      code:"TRY",

      name:
        "Türk Lirası (TL)",

      buy:1,

      sell:1,

      updatedAt:
        data.updatedAt

    };


    /*
      Menüleri yenile
    */

    buildAssetOptions();


    /*
      Ekranı yenile
    */

    render();

    renderPrices();


    /*
      Saat
    */

    const now =
      new Date();


    document
      .getElementById(
        "time"
      )
      .textContent =
        now.toLocaleTimeString(
          "tr-TR",
          {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
          }
        );


    document
      .getElementById(
        "updated"
      )
      .textContent =
        data.updatedAt

          ? "Altınkaynak güncellemesi: " +
            data.updatedAt

          : "Altınkaynak verisi güncel";


    document
      .getElementById(
        "live"
      )
      .textContent =
        "● CANLI";


  }catch(error){

    console.error(
      "Fiyat yükleme hatası:",
      error
    );


    document
      .getElementById(
        "live"
      )
      .textContent =
        "● BAĞLANTI YOK";


    document
      .getElementById(
        "updated"
      )
      .textContent =
        "Canlı veri bağlantısı kurulamadı.";


    buildAssetOptions();

    render();

    renderPrices();

  }

}


/* =========================
   KAYDET
========================= */

function save(show=true){

  localStorage.setItem(
    "altinAssets",
    JSON.stringify(
      assets
    )
  );


  if(show){

    showToast(
      "Portföy kaydedildi"
    );

  }

}


/* =========================
   MODAL
========================= */

function openModal(){

  const modal =
    document.getElementById(
      "modal"
    );


  modal.style.display =
    "flex";


  document.body.style.overflow =
    "hidden";


  setTimeout(
    () => {

      document
        .getElementById(
          "qty"
        )
        .focus();

    },
    100
  );

}


function closeModal(){

  document
    .getElementById(
      "modal"
    )
    .style.display =
      "none";


  document.body.style.overflow =
    "";

}


/* =========================
   VARLIK EKLE
========================= */

function addAsset(){

  const quantity =
    parseFloat(
      document
        .getElementById(
          "qty"
        )
        .value
    );


  const selectedCode =
    type.value;


  if(!selectedCode){

    showToast(
      "Önce varlık seç"
    );

    return;

  }


  if(
    !Number.isFinite(
      quantity
    ) ||
    quantity <= 0
  ){

    showToast(
      "Geçerli bir miktar gir"
    );

    return;

  }


  /*
    TL
  */

  if(
    selectedCode === "TRY"
  ){

    assets.push({

      code:"TRY",

      type:
        "Türk Lirası (TL)",

      qty:quantity

    });

  }


  /*
    ALTIN / DÖVİZ
  */

  else{

    const selectedGold =
      goldProducts.find(
        item =>
          item.code ===
          selectedCode
      );


    const selectedCurrency =
      currencyProducts.find(
        item =>
          item.code ===
          selectedCode
      );


    const selected =
      selectedGold ||
      selectedCurrency;


    assets.push({

      code:
        selectedCode,

      type:
        selected
          ? selected.name
          : selectedCode,

      qty:
        quantity

    });

  }


  save(false);

  render();


  document
    .getElementById(
      "qty"
    )
    .value = "";


  closeModal();


  showToast(
    "Varlık portföye eklendi"
  );

}


/* =========================
   TOAST
========================= */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.style.display =
    "block";


  setTimeout(
    () => {

      toast.style.display =
        "none";

    },
    1800
  );

}


/* =========================
   BAŞLANGIÇ
========================= */

render();

load();


/*
  30 saniyede bir yenile
*/

setInterval(
  load,
  30000
);

</script>

</body>
</html>
